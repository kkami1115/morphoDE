# morphoDE reproduction environment.
# Pinned to the versions the published analysis was run with (Python 3.11).
#   conda env create -f environment.yml
#   conda activate morphode
name: morphode
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=2.1.3
  - scipy=1.13.1
  - pandas=2.2.3
  - anndata=0.12.19
  - scanpy=1.11.5
  - scikit-learn=1.9.0
  - scikit-image=0.24.0
  - trimesh=4.12.2
  - h5py=3.16.0
  - networkx=3.1
  - numba=0.65.1
  - matplotlib=3.10.9
  - zstandard=0.25.0          # only needed for scripts/download.py --compress
  - zstd                       # `zstd` CLI, used by the demo/downloader for .h5ad.zst
  - pip
